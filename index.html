<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебное приглашение</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

    <div class="music-control">
        <audio id="bg-music" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>
        <button id="music-btn" class="music-btn">🎵 </button>
    </div>

    <div class="invitation-card">
        <div class="floral-bg"></div>

        <svg class="hexagon" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polygon points="20,2 80,2 98,50 80,98 20,98 2,50" />
        </svg>

        <div class="content">
            <p id="guest-name" class="fade-text delay-1">Дорогие гости!</p>
            <p class="fade-text delay-2">Мы приглашаем Вас на свадебное торжество!</p>
            
            <div class="names fade-text delay-3">
                <span class="name">Pavel</span>
                <span class="ampersand">&</span>
                <span class="name">Erkina</span>
            </div>
            
            <div class="details fade-text delay-4">
                <p>28 ноября</p>
                <p>17:00 фуршет</p>
                <p>17:30 основная часть</p>
                <br>
                <p>ул. В.И. Ленина, 367, Элиста</p>
                <p>ресторан "Иткл"</p>
            </div>
        </div>
    </div> 
    <div class="rsvp-section fade-text delay-5">
        <p class="rsvp-text">Будем рады разделить этот день с Вами!</p>
        <button id="confirm-btn" class="submit-btn">Я с удовольствием приду!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
